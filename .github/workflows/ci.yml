name: Continuous Integration

on: 
  pull_request:
    types: [opened, reopened, edited, synchronize]

jobs: 
  ci-build-check:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
           node-version: 20
           cache: npm
      - run: echo "Initiated by ${{ github.actor }}"
      - run: npm ci
      - run: npm run build
      - run: npm run test
      
      
